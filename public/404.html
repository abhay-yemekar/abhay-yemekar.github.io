<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Abhay Yemekar</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <meta name="theme-color" content="#0b0b0c" />
    <!--
      Standalone by design: this file is served directly by GitHub Pages and
      never passes through the bundler, so the styles are inline and the fonts
      are system fallbacks. It only has one job — get the visitor home.
    -->
    <style>
      :root {
        --bg: #0b0b0c;
        --fg: #edeae4;
        --muted: #a6a29a;
        --subtle: #6e6a63;
        --accent: #e8a33d;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f5f1;
          --fg: #14161a;
          --muted: #55524c;
          --subtle: #7d7970;
          --accent: #8f5a0c;
          color-scheme: light;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 34rem;
      }
      .eyebrow {
        margin: 0;
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--subtle);
      }
      h1 {
        margin: 1.25rem 0 0;
        font-family: ui-serif, Georgia, serif;
        font-weight: 400;
        font-size: clamp(2rem, 6vw, 3rem);
        line-height: 1.1;
        letter-spacing: -0.02em;
      }
      h1 em {
        color: var(--accent);
      }
      p {
        margin: 1.25rem 0 0;
        color: var(--muted);
      }
      a.home {
        display: inline-block;
        margin-top: 2.5rem;
        padding-bottom: 0.25rem;
        border-bottom: 1px solid var(--accent);
        font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg);
        text-decoration: none;
        transition: color 200ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      a.home:hover,
      a.home:focus-visible {
        color: var(--accent);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>This page doesn’t <em>exist</em>.</h1>
      <p>
        The link is either out of date or slightly mistyped. Everything lives on a
        single page, so the homepage has all of it.
      </p>
      <a class="home" href="/">Back to homepage</a>
    </main>
  </body>
</html>
