<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page tags (title, canonical, Open Graph, JSON-LD) come from src/entry-server.tsx. -->
    <!--app-head-->
    <meta name="author" content="Abhay Yemekar" />
    <meta name="theme-color" content="#f7f5ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Runs before first paint. With no stored choice it does nothing about the
      theme: CSS follows prefers-color-scheme, live. It only applies a theme
      the visitor picked with the toggle, and marks the page as JS-capable so
      the toggle becomes visible. Kept inline and dependency-free on purpose.
    -->
    <script>
      ;(function () {
        var root = document.documentElement
        root.classList.add('js')
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark') root.dataset.theme = stored
        } catch (e) {
          /* Private mode or blocked storage: the OS preference stands. */
        }
      })()
    </script>

    <script type="module" src="/src/client/main.ts"></script>
  </head>
  <body>
    <!--app-html-->
  </body>
</html>
