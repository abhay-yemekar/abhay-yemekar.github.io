<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page tags (title, canonical, Open Graph, JSON-LD) come from src/entry-server.tsx. -->
    <!--app-head-->
    <meta name="author" content="Abhay Yemekar" />
    <meta name="theme-color" content="#faf8f3" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Runs before first paint, inline and dependency-free on purpose. It sets:
      - .js, so JS-only controls become visible;
      - data-theme, only for a theme the visitor picked with the toggle (light is
        the default without it);
      - data-motion="on" or "paused": paused under prefers-reduced-motion (v4
        follows the OS setting; each case-page film has its own Play button).
    -->
    <script>
      ;(function () {
        var root = document.documentElement
        root.classList.add('js')
        var theme = null
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {
          /* Private mode or blocked storage: the default theme applies. */
        }
        if (theme === 'light' || theme === 'dark') root.dataset.theme = theme
        root.dataset.motion = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'paused' : 'on'
      })()
    </script>

    <script type="module" src="/src/client/main.ts"></script>
  </head>
  <body>
    <!--app-html-->
  </body>
</html>
